<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTO VALUE | Enterprise Auto Valuation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                <circle cx="7" cy="17" r="2" />
                <circle cx="17" cy="17" r="2" />
                <path d="M14 10l-2-2m-2 2l2-2" /> </svg>
            MOTO VALUE <span class="nav-tag">PRO</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active">Valuation</a>
            <a href="#">History</a>
            <a href="#">Account</a>
        </div>
    </nav>

    <div class="main-container">
        
        <div class="card">
            <div class="card-header centered-header">
                <h2>Vehicle Valuation</h2>
                <p>Enter vehicle details below to generate a real-time market estimate.</p>
            </div>

            <!-- Inline accessible error alert -->
            <div id="errorAlert" class="error-alert hidden" role="alert" aria-live="assertive">
                <span id="errorMessage"></span>
            </div>

            <form id="predictionForm" class="form-grid">
                
                <div class="form-group">
                    <label>Brand</label>
                    <select id="brand" onchange="updateModels()" class="form-control">
                        <option value="" disabled selected>Select Manufacturer</option>
                        {% for brand in brands %}
                        <option value="{{ brand }}">{{ brand }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Model</label>
                    <select id="model" class="form-control">
                        <option value="" disabled selected>Select Brand First</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="year" value="2019" class="form-control">
                </div>
                
                <div class="form-group">
                    <label>Kilometers</label>
                    <input type="number" id="km_driven" value="45000" class="form-control">
                </div>

                <div class="form-group">
                    <label>Mileage (kmpl)</label>
                    <input type="number" step="0.1" id="mileage" value="18.5" class="form-control">
                </div>

                <div class="form-group">
                    <label>Engine (CC)</label>
                    <input type="number" id="engine" value="1197" class="form-control">
                </div>

                <div class="form-group">
                    <label>Max Power (bhp)</label>
                    <input type="number" step="0.1" id="max_power" value="82.0" class="form-control">
                </div>

                <div class="form-group">
                    <label>Seats</label>
                    <select id="seats" class="form-control">
                        <option value="5" selected>5 Seats</option>
                        <option value="7">7 Seats</option>
                        <option value="4">4 Seats</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fuel Type</label>
                    <select id="fuel" class="form-control">
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Transmission</label>
                    <select id="transmission" class="form-control">
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Seller Type</label>
                    <select id="seller_type" class="form-control">
                        <option value="Individual">Individual</option>
                        <option value="Dealer">Dealer</option>
                        <option value="Trustmark Dealer">Trustmark Dealer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Owner</label>
                    <select id="owner" class="form-control">
                        <option value="First Owner">First Owner</option>
                        <option value="Second Owner">Second Owner</option>
                        <option value="Third Owner">Third Owner</option>
                        <option value="Fourth & Above Owner">4th+ Owner</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="predictPrice()" id="submitBtn" class="btn-primary">
                        <span id="btnSpinner" class="spinner hidden"></span>
                        <span id="btnText">Calculate Value</span>
                    </button>
                </div>

            </form>
        </div>

        <div id="result" class="result-card hidden">
            <div class="result-content">
                <div class="result-header">Estimated Market Value</div>
                <div class="price-tag" id="priceText">₹ 0.00</div>
                <div class="result-disclaimer">
                    MOTO VALUE Estimate • <span id="dateDisplay"></span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Set today's date in disclaimer
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString();

        const carHierarchy = {{ car_hierarchy | safe }};
        function updateModels() {
            const brandSelect = document.getElementById("brand");
            const modelSelect = document.getElementById("model");
            const selectedBrand = brandSelect.value;
            modelSelect.innerHTML = '<option value="" disabled selected>Select Model</option>';
            if (carHierarchy[selectedBrand]) {
                const models = carHierarchy[selectedBrand];
                models.sort();
                models.forEach(model => {
                    const option = document.createElement("option");
                    option.value = model;
                    option.text = model;
                    modelSelect.appendChild(option);
                });
            }
        }
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
